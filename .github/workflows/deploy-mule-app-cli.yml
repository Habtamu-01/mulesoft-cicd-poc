name: MuleSoft CLI - Deploy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:

      environment:
        description: 'Target Anypoint environment'
        required: true
        type: choice
        options:
          - Sandbox
          - dev
          - test1
          - test2
          - training
          - Staging
          - prod

      asset_version:
        description: 'Published Exchange version to deploy (example: 1.0.7)'
        required: true
        type: string


# =========================================================
# Prevent simultaneous CLI deployments to same environment
# =========================================================
concurrency:
  group: mulesoft-cli-deploy-${{ inputs.environment }}
  cancel-in-progress: false


jobs:

  deploy-cli:

    runs-on: ubuntu-latest

    # GitHub Environment
    environment: ${{ inputs.environment }}

    env:

      # Target Anypoint environment
      ENV_NAME: ${{ inputs.environment }}

      # Runtime configuration from GitHub Repository Variables
      RUNTIME_VERSION: ${{ vars.RUNTIME }}
      RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL }}
      JAVA_VERSION: ${{ vars.JAVA_VERSION }}

      # Connected App credentials
      CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}


    steps:

      # =========================================================
      # 1. SETUP NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # =========================================================
      # 2. INSTALL REQUIRED TOOLS
      # =========================================================
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq


      # =========================================================
      # 3. INSTALL ANYPOINT CLI V4
      # =========================================================
      - name: Install Anypoint CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Anypoint CLI v4"
          echo "=========================================="

          npm install -g anypoint-cli-v4

          echo ""
          echo "Installed CLI version:"
          anypoint-cli-v4 --version


      # =========================================================
      # 4. VALIDATE DEPLOYMENT VERSION
      # =========================================================
      - name: Validate deployment input
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.asset_version }}"

          echo "Validating Exchange version:"
          echo "$VERSION"

          if ! echo "$VERSION" | \
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$'; then

            echo ""
            echo "ERROR: Invalid asset version: $VERSION"
            echo "Expected format similar to: 1.0.7"

            exit 1

          fi

          echo ""
          echo "Deployment version validated successfully."


      # =========================================================
      # 5. PREPARE DEPLOYMENT VARIABLES
      # =========================================================
      - name: Prepare deployment variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ vars.APPLICATION_NAME }}"

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: GitHub variable APPLICATION_NAME is empty."
            exit 1
          fi

          if [ -z "$RUNTIME_VERSION" ]; then
            echo "ERROR: GitHub variable RUNTIME is empty."
            exit 1
          fi

          if [ -z "$RELEASE_CHANNEL" ]; then
            echo "ERROR: GitHub variable RELEASE_CHANNEL is empty."
            exit 1
          fi

          if [ -z "$JAVA_VERSION" ]; then
            echo "ERROR: GitHub variable JAVA_VERSION is empty."
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "CLI DEPLOYMENT INFORMATION"
          echo "=========================================="
          echo "Application       : $APP_NAME"
          echo "Environment       : $ENV_NAME"
          echo "Exchange Version  : ${{ inputs.asset_version }}"
          echo "Deployment Target : ${{ vars.DEPLOYMENT_TARGET }}"
          echo "Runtime           : $RUNTIME_VERSION"
          echo "Release Channel   : $RELEASE_CHANNEL"
          echo "Java Version      : $JAVA_VERSION"
          echo "Replicas          : ${{ vars.WORKERS }}"
          echo "Replica Size      : ${{ vars.WORKERSIZE }}"
          echo "=========================================="


      # =========================================================
      # 6. VERIFY REQUESTED EXCHANGE VERSION EXISTS
      # =========================================================
      - name: Verify Exchange asset version
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="$APP_NAME"
          VERSION="${{ inputs.asset_version }}"

          echo "=========================================="
          echo "Checking Exchange"
          echo "=========================================="

          echo "Application : $APP_ID"
          echo "Version     : $VERSION"

          EXCHANGE_RESPONSE=$(anypoint-cli-v4 exchange:asset:list \
            "$APP_ID" \
            --client_id="$CONNECTED_APP_CLIENT_ID" \
            --client_secret="$CONNECTED_APP_CLIENT_SECRET" \
            --organizationId="${{ secrets.ANYPOINT_ORG }}" \
            --output=json)

          FOUND=$(echo "$EXCHANGE_RESPONSE" | \
            jq -r \
              --arg id "$APP_ID" \
              --arg version "$VERSION" \
              '.[] |
               select(
                 .assetId == $id and
                 .version == $version
               ) |
               .version' | \
            head -n 1)

          if [ "$FOUND" != "$VERSION" ]; then

            echo ""
            echo "ERROR: Exchange asset version was not found."
            echo "Application : $APP_ID"
            echo "Version     : $VERSION"

            exit 1

          fi

          echo ""
          echo "Exchange asset verified successfully."


      # =========================================================
      # 7. CHECK WHETHER APPLICATION ALREADY EXISTS
      # =========================================================
      - name: Check if application exists in CloudHub
        id: check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Runtime Manager"
          echo "=========================================="

          echo "Application : $APP_NAME"
          echo "Environment : $ENV_NAME"

          RESULT=$(anypoint-cli-v4 runtime-mgr:application:list \
            --organization="${{ secrets.ANYPOINT_ORG }}" \
            --client_id="$CONNECTED_APP_CLIENT_ID" \
            --client_secret="$CONNECTED_APP_CLIENT_SECRET" \
            --environment="$ENV_NAME" \
            --output=json)

          EXISTING_NAME=$(echo "$RESULT" | \
            jq -r \
              --arg name "$APP_NAME" \
              '.[] |
               select(.name == $name) |
               .name' | \
            head -n 1)

          EXISTING_ID=$(echo "$RESULT" | \
            jq -r \
              --arg name "$APP_NAME" \
              '.[] |
               select(.name == $name) |
               .id // empty' | \
            head -n 1)

          if [ -n "$EXISTING_NAME" ]; then

            echo ""
            echo "Application already exists."
            echo "Application Name : $EXISTING_NAME"
            echo "Application ID   : $EXISTING_ID"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "application_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "Application does not currently exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # =========================================================
      # 8. DEPLOY NEW APPLICATION
      #
      # Runs only when application does NOT already exist
      # =========================================================
      - name: Deploy new application using Anypoint CLI
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Deploying NEW CloudHub application"
          echo "=========================================="

          echo "Application     : $APP_NAME"
          echo "Version         : ${{ inputs.asset_version }}"
          echo "Environment     : $ENV_NAME"
          echo "Target          : ${{ vars.DEPLOYMENT_TARGET }}"
          echo "Runtime         : $RUNTIME_VERSION"
          echo "Release Channel : $RELEASE_CHANNEL"
          echo "Java Version    : $JAVA_VERSION"
          echo "Replicas        : ${{ vars.WORKERS }}"
          echo "Replica Size    : ${{ vars.WORKERSIZE }}"

          anypoint-cli-v4 runtime-mgr:application:deploy \
            "$APP_NAME" \
            "${{ vars.DEPLOYMENT_TARGET }}" \
            "$RUNTIME_VERSION" \
            "$APP_NAME" \
            --organization="${{ secrets.ANYPOINT_ORG }}" \
            --client_id="$CONNECTED_APP_CLIENT_ID" \
            --client_secret="$CONNECTED_APP_CLIENT_SECRET" \
            --environment="$ENV_NAME" \
            --groupId="${{ secrets.ANYPOINT_ORG }}" \
            --assetVersion="${{ inputs.asset_version }}" \
            --releaseChannel="$RELEASE_CHANNEL" \
            --javaVersion="$JAVA_VERSION" \
            --replicas="${{ vars.WORKERS }}" \
            --replicaSize="${{ vars.WORKERSIZE }}" \
            --property="mule.env:dev"

          echo ""
          echo "New application deployment command completed."


      # =========================================================
      # 9. UPDATE EXISTING APPLICATION
      #
      # Runs only when application ALREADY exists
      # =========================================================
      - name: Update existing application using Anypoint CLI
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="${{ steps.check.outputs.application_id }}"

          if [ -z "$APP_ID" ]; then
            echo "ERROR: Existing application ID was not returned."
            exit 1
          fi

          echo "=========================================="
          echo "Updating EXISTING CloudHub application"
          echo "=========================================="

          echo "Application     : $APP_NAME"
          echo "Application ID  : $APP_ID"
          echo "Version         : ${{ inputs.asset_version }}"
          echo "Environment     : $ENV_NAME"
          echo "Runtime         : $RUNTIME_VERSION"
          echo "Release Channel : $RELEASE_CHANNEL"
          echo "Java Version    : $JAVA_VERSION"
          echo "Replicas        : ${{ vars.WORKERS }}"
          echo "Replica Size    : ${{ vars.WORKERSIZE }}"

          anypoint-cli-v4 runtime-mgr:application:modify \
            "$APP_ID" \
            --organization="${{ secrets.ANYPOINT_ORG }}" \
            --client_id="$CONNECTED_APP_CLIENT_ID" \
            --client_secret="$CONNECTED_APP_CLIENT_SECRET" \
            --environment="$ENV_NAME" \
            --groupId="${{ secrets.ANYPOINT_ORG }}" \
            --artifactId="$APP_NAME" \
            --assetVersion="${{ inputs.asset_version }}" \
            --runtimeVersion="$RUNTIME_VERSION" \
            --releaseChannel="$RELEASE_CHANNEL" \
            --javaVersion="$JAVA_VERSION" \
            --replicas="${{ vars.WORKERS }}" \
            --replicaSize="${{ vars.WORKERSIZE }}" \
            --property="mule.env:dev"

          echo ""
          echo "Existing application update command completed."


      # =========================================================
      # 10. VERIFY APPLICATION EXISTS AFTER DEPLOYMENT/UPDATE
      # =========================================================
      - name: Verify CloudHub deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying CloudHub deployment"
          echo "=========================================="

          echo "Application : $APP_NAME"
          echo "Environment : $ENV_NAME"

          RESULT=$(anypoint-cli-v4 runtime-mgr:application:list \
            --organization="${{ secrets.ANYPOINT_ORG }}" \
            --client_id="$CONNECTED_APP_CLIENT_ID" \
            --client_secret="$CONNECTED_APP_CLIENT_SECRET" \
            --environment="$ENV_NAME" \
            --output=json)

          FOUND=$(echo "$RESULT" | \
            jq -r \
              --arg name "$APP_NAME" \
              '.[] |
               select(.name == $name) |
               .name' | \
            head -n 1)

          if [ "$FOUND" != "$APP_NAME" ]; then

            echo ""
            echo "ERROR: Application was not found after deployment."

            exit 1

          fi

          echo ""
          echo "Application found in Runtime Manager."
          echo "Deployment verification successful."


      # =========================================================
      # 11. DEPLOYMENT SUMMARY
      # =========================================================
      - name: Deployment Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "CLI DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Application     : $APP_NAME"
          echo "Version         : ${{ inputs.asset_version }}"
          echo "Environment     : $ENV_NAME"
          echo "Target          : ${{ vars.DEPLOYMENT_TARGET }}"
          echo "Runtime         : $RUNTIME_VERSION"
          echo "Release Channel : $RELEASE_CHANNEL"
          echo "Java Version    : $JAVA_VERSION"
          echo "Method          : Anypoint CLI v4"
          echo "=========================================="

          echo "### MuleSoft CLI - Deployment" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Application | $APP_NAME |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Exchange Version | ${{ inputs.asset_version }} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Environment | $ENV_NAME |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Target | ${{ vars.DEPLOYMENT_TARGET }} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Runtime | $RUNTIME_VERSION |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Release Channel | $RELEASE_CHANNEL |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Java Version | $JAVA_VERSION |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Replicas | ${{ vars.WORKERS }} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Replica Size | ${{ vars.WORKERSIZE }} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Deployment Method | Anypoint CLI v4 |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Existing Before Deployment | ${{ steps.check.outputs.exists }} |" \
            >> "$GITHUB_STEP_SUMMARY"
