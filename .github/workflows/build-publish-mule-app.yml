name: MuleSoft - Build & Publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit SHA to build and publish'
        required: true
        type: string

      version_bump:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor


concurrency:
  group: mulesoft-build-publish
  cancel-in-progress: false


jobs:

  build-publish:
    runs-on: ubuntu-latest

    env:
      CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}


    steps:

      # =========================================================
      # 1. CHECKOUT EXACT COMMIT
      # =========================================================
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0


      # =========================================================
      # 2. VERIFY COMMIT
      # =========================================================
      - name: Verify selected commit
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED_COMMIT="${{ inputs.commit_sha }}"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Requested Commit : $REQUESTED_COMMIT"
          echo "Actual Commit    : $ACTUAL_COMMIT"

          RESOLVED_COMMIT="$(git rev-parse "${REQUESTED_COMMIT}^{commit}")"

          if [ "$RESOLVED_COMMIT" != "$ACTUAL_COMMIT" ]; then
            echo "ERROR: Checked-out commit does not match requested commit."
            exit 1
          fi

          echo "Commit verified successfully."


      # =========================================================
      # 3. JAVA / MAVEN SETUP
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven


      # =========================================================
      # 4. INSTALL REQUIRED UTILITIES
      # =========================================================
      - name: Install XML / JSON tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y xmlstarlet libxml2-utils jq


      # =========================================================
      # 5. GENERATE VERSIONED POM
      #
      # Supports:
      #   patch : 1.0.7 -> 1.0.8
      #   minor : 1.0.7 -> 1.1.0
      #
      # Major version changes are intentionally handled
      # outside this automated workflow for now.
      # =========================================================
      - name: Generate versioned POM
        shell: bash
        run: |
          set -euo pipefail

          cp pom.xml generated-pom.xml

          CURRENT_VERSION=$(xmllint \
            --xpath "//*[local-name()='project']/*[local-name()='version']/text()" \
            pom.xml)

          ASSET_ID=$(xmllint \
            --xpath "//*[local-name()='project']/*[local-name()='artifactId']/text()" \
            pom.xml)

          VERSION_BUMP="${{ inputs.version_bump }}"

          echo "Current Version : $CURRENT_VERSION"
          echo "Asset ID        : $ASSET_ID"
          echo "Version Bump    : $VERSION_BUMP"


          # -------------------------------------------------------
          # Generate Anypoint OAuth token
          # -------------------------------------------------------
          TOKEN_RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"${CONNECTED_APP_CLIENT_ID}\",\"client_secret\":\"${CONNECTED_APP_CLIENT_SECRET}\"}")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Unable to generate Anypoint access token."
            exit 1
          fi

          echo "Access token generated successfully."


          # -------------------------------------------------------
          # Get latest published Exchange version
          # -------------------------------------------------------
          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://anypoint.mulesoft.com/exchange/api/v2/assets/${{ secrets.ANYPOINT_ORG }}/$ASSET_ID")

          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')

          echo "Latest Exchange Version: ${LATEST_VERSION:-none}"


          # -------------------------------------------------------
          # Generate next Exchange version
          #
          # patch : 1.0.7 -> 1.0.8
          # minor : 1.0.7 -> 1.1.0
          #
          # Major version changes are intentionally handled
          # outside this automated workflow for now.
          # -------------------------------------------------------
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then

            # Preserve existing first-version behavior
            NEW_VERSION="1.0.1"

          else

            CLEAN_VERSION=$(echo "$LATEST_VERSION" | sed 's/-.*//')

            MAJOR=$(echo "$CLEAN_VERSION" | awk -F. '{print $1}')
            MINOR=$(echo "$CLEAN_VERSION" | awk -F. '{print $2}')
            PATCH=$(echo "$CLEAN_VERSION" | awk -F. '{print $3}')

            if [ -z "$MAJOR" ]; then MAJOR=1; fi
            if [ -z "$MINOR" ]; then MINOR=0; fi
            if [ -z "$PATCH" ]; then PATCH=0; fi


            case "$VERSION_BUMP" in

              patch)
                NEXT_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
                ;;

              minor)
                NEXT_MINOR=$((MINOR + 1))
                NEW_VERSION="${MAJOR}.${NEXT_MINOR}.0"
                ;;

              *)
                echo "ERROR: Invalid version bump type: $VERSION_BUMP"
                exit 1
                ;;

            esac

          fi


          echo ""
          echo "=========================================="
          echo "VERSION INFORMATION"
          echo "=========================================="
          echo "Latest Exchange Version : ${LATEST_VERSION:-none}"
          echo "Version Bump            : $VERSION_BUMP"
          echo "New Exchange Version    : $NEW_VERSION"
          echo "=========================================="


          # -------------------------------------------------------
          # Update application artifact ID
          # -------------------------------------------------------
          xmlstarlet ed -L \
            -N x="http://maven.apache.org/POM/4.0.0" \
            -u "/x:project/x:properties/x:app.artifactId" \
            -v "$ASSET_ID" \
            generated-pom.xml


          # -------------------------------------------------------
          # Update Maven project version
          # -------------------------------------------------------
          xmlstarlet ed -L \
            -N x="http://maven.apache.org/POM/4.0.0" \
            -u "/x:project/x:version" \
            -v "$NEW_VERSION" \
            generated-pom.xml


          # Make values available to later steps
          echo "ASSET_ID=$ASSET_ID" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"


      # =========================================================
      # 6. BUILD MULE APPLICATION
      #
      # attachMuleSources includes Mule project sources inside
      # the deployable archive so the packaged application can
      # be imported back into Anypoint Studio.
      # =========================================================
      - name: Build Mule application with project sources
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Mule application"
          echo "Asset   : $ASSET_ID"
          echo "Version : $ASSET_VERSION"
          echo "Attaching Mule project sources"
          echo "=========================================="

          mvn clean install \
            -f generated-pom.xml \
            --settings .maven/settings.xml \
            -DskipMunitTests \
            -Denv=dev \
            -DattachMuleSources


      # =========================================================
      # 7. VERIFY SOURCES ARE ATTACHED
      #
      # Prevent publishing a JAR that cannot later
      # be imported into Anypoint Studio.
      # =========================================================
      - name: Verify Mule sources are attached
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated Mule application JAR..."

          JAR_FILE=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*-mule-application.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Mule application JAR was not generated."
            exit 1
          fi

          echo "Generated JAR: $JAR_FILE"

          echo ""
          echo "Checking for META-INF/mule-src..."
          echo ""

          if jar tf "$JAR_FILE" | grep -q '^META-INF/mule-src/'; then
            echo "SUCCESS: Mule project sources are attached."
          else
            echo "ERROR: META-INF/mule-src was not found."
            echo "The application will NOT be published."
            exit 1
          fi


      # =========================================================
      # 8. PUBLISH TO ANYPOINT EXCHANGE
      # =========================================================
      - name: Publish application to Exchange
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Publishing Mule application to Exchange"
          echo "Asset   : $ASSET_ID"
          echo "Version : $ASSET_VERSION"
          echo "=========================================="

          mvn deploy \
            -e \
            -f generated-pom.xml \
            --settings .maven/settings.xml \
            -DskipMunitTests \
            -Denv=dev \
            -DattachMuleSources


      # =========================================================
      # 9. BUILD / PUBLISH SUMMARY
      # =========================================================
      - name: Build and Publish Summary
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD AND PUBLISH SUCCESSFUL"
          echo "=========================================="
          echo "Asset        : $ASSET_ID"
          echo "Version      : $ASSET_VERSION"
          echo "Version Bump : ${{ inputs.version_bump }}"
          echo "Commit       : $(git rev-parse HEAD)"
          echo "Sources      : Attached"
          echo "=========================================="

          echo "### MuleSoft Build & Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Asset | $ASSET_ID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exchange Version | $ASSET_VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Increment | ${{ inputs.version_bump }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | $(git rev-parse HEAD) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mule Sources Attached | Yes |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Deploy this Exchange version:** \`$ASSET_VERSION\`" \
            >> "$GITHUB_STEP_SUMMARY"
